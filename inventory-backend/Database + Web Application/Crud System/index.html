<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inventory | Product workspace</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="shell">
		<header class="topbar"><div class="brand"><span class="brand-mark">+</span> Inventory desk</div><div class="date" id="today"></div></header>
		<main>
			<section class="intro"><div><h1>Know what<br>you have.</h1></div><p class="intro-copy">A clear, quiet place to keep your product list current. Add your first item to begin building the inventory.</p></section>
			<section class="metrics" aria-label="Inventory summary"><div class="metric"><span>Total products</span><strong id="total-count">0</strong></div><div class="metric"><span>Units in stock</span><strong id="unit-count">0</strong></div><div class="metric"><span>Inventory value</span><strong id="value-count">$0.00</strong></div></section>
			<section class="workspace" aria-label="Products">
				<div class="toolbar"><div class="filters"><label class="field"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search products" aria-label="Search products"></label><label class="field"><select id="category-filter" aria-label="Filter by category"><option value="">All categories</option></select></label></div><button class="button" id="add-product">+ Add product</button></div>
				<div class="status" id="status" role="alert"></div><div id="product-view"></div>
			</section>
		</main>
	</div>
	<div class="modal-backdrop" id="modal" hidden><form class="modal" id="product-form"><h2 id="form-title">Add product</h2><div class="form-grid"><label>Product name<input name="name" required maxlength="150"></label><label>Category<input name="category" required maxlength="100"></label><label>Quantity<input name="quantity" type="number" min="0" step="1" value="0" required></label><label>Price<input name="price" type="number" min="0" step="0.01" value="0.00" required></label></div><div class="form-actions"><button class="cancel" type="button" id="cancel-form">Cancel</button><button class="button" type="submit">Save product</button></div></form></div>
	<script src="app.js"></script>
</body>
</html>
